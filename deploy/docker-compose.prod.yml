# Production stack. Run from the repo root:
#   docker compose -p sfmail -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# Postgres and Redis are internal only (no host ports). The web app and API are published on BIND_ADDR
# (set it to 127.0.0.1 once the Caddy proxy is on, so only 80/443 face the internet).
# Auto-deployed by .github/workflows/deploy.yml; one-time server setup in deploy/DEPLOY.md.
name: sfmail

services:
  postgres:
    image: postgres:16-alpine
    container_name: sfmail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sfmail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sfmail
    volumes:
      - sfmail_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sfmail -d sfmail']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [sfmail]

  redis:
    image: redis:7-alpine
    container_name: sfmail-redis
    restart: unless-stopped
    volumes:
      - sfmail_redis:/data
    networks: [sfmail]

  api:
    build: ../apps/api
    image: sfmail-api
    container_name: sfmail-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sfmail:${POSTGRES_PASSWORD}@postgres:5432/sfmail
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: '1'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports:
      - '${BIND_ADDR:-0.0.0.0}:${API_PORT:-8010}:8000'
    networks: [sfmail]

  worker:
    image: sfmail-api
    container_name: sfmail-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sfmail:${POSTGRES_PASSWORD}@postgres:5432/sfmail
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: '0'
    command: ['python', '-m', 'app.worker']
    depends_on:
      api: { condition: service_started }
    networks: [sfmail]

  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL}/api/v1
    image: sfmail-web
    container_name: sfmail-web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - '${BIND_ADDR:-0.0.0.0}:${WEB_PORT:-3010}:3010'
    networks: [sfmail]

  # HTTPS reverse proxy with automatic Let's Encrypt certs. Opt-in: COMPOSE_PROFILES=proxy in deploy/.env.
  caddy:
    image: caddy:2-alpine
    container_name: sfmail-caddy
    restart: unless-stopped
    profiles: [proxy]
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - sfmail_caddy_data:/data
      - sfmail_caddy_config:/config
    ports:
      - '80:80'
      - '443:443'
    depends_on: [web, api]
    networks: [sfmail]

volumes:
  sfmail_pg:
  sfmail_redis:
  sfmail_caddy_data:
  sfmail_caddy_config:

networks:
  sfmail:
    name: sfmail
