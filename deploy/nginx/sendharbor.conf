# Proxy rules for sendharbor.sigmaflux.in on the aaPanel nginx.
# The panel's site (/www/server/panel/vhost/nginx/sendharbor.sigmaflux.in.conf) already handles listen 80/443
# and the SSL certificate, and includes every *.conf in its extension dir. Install this file there:
#   cp deploy/nginx/sendharbor.conf /www/server/panel/vhost/nginx/extension/sendharbor.sigmaflux.in/sendharbor-app.conf
#   nginx -t && nginx -s reload
#
# ^~ makes these prefix matches win over the panel's regex locations (static js/css/images, PHP),
# so the app's own assets are served by the app instead of the empty site root.

# Keep the panel's Let's Encrypt renewal working (served from the site root, not the app).
location ^~ /.well-known/acme-challenge/ {
    root /www/wwwroot/sendharbor.sigmaflux.in;
    allow all;
}

# API, tracking, unsubscribe and OAuth callbacks.
location ^~ /api/ {
    client_max_body_size 25m;   # CSV lead imports
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location = /health {
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host $host;
}

# Everything else: the Next.js web app.
location ^~ / {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
}
