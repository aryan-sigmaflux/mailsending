# Host nginx site for Sendharbor. Install once on the server (see deploy/DEPLOY.md):
#   cp deploy/nginx/sendharbor.conf /etc/nginx/sites-available/sendharbor.conf
#   ln -s /etc/nginx/sites-available/sendharbor.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d sendharbor.sigmaflux.in --redirect     # adds the HTTPS (443) part
#
# One host: /api/* (API, tracking, unsubscribe, OAuth callbacks) and /health go to the API container,
# everything else to the web container. Both are published on 127.0.0.1 only (BIND_ADDR=127.0.0.1).
server {
    listen 80;
    listen [::]:80;
    server_name sendharbor.sigmaflux.in;

    client_max_body_size 25m;   # CSV lead imports

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8010;
    }

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:3010;
    }
}
