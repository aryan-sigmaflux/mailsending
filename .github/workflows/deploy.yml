# Auto-deploy to the VPS on every push to main (or manually from the Actions tab).
# Needs repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY. One-time server setup: deploy/DEPLOY.md
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pull and rebuild on the server
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: /opt/sendharbor
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_DIR,SHA
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            test -f deploy/.env || { echo "deploy/.env missing in $APP_DIR (see deploy/DEPLOY.md)"; exit 1; }

            git fetch --prune origin main
            git reset --hard "$SHA"

            docker compose -p sfmail -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build --remove-orphans
            docker image prune -f

            # Smoke check: API answers from inside its container.
            for i in $(seq 1 30); do
              if docker exec sfmail-api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)" >/dev/null 2>&1; then
                echo "Deployed $SHA"; docker compose -p sfmail -f deploy/docker-compose.prod.yml --env-file deploy/.env ps; exit 0
              fi
              sleep 5
            done
            echo "API did not come up"; docker logs --tail 80 sfmail-api; exit 1
